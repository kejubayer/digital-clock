<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Digital Clock</title>

<link rel="icon" href="clock-icon.png" type="image/png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<style>
:root {
    --bg-1: #070b1b;
    --bg-2: #121b3a;
    --accent: #8af1ff;
    --accent-2: #8f9dff;
    --text: #eef3ff;
    --muted: #b7c1e1;
}

* { margin:0; padding:0; box-sizing:border-box; font-family:"Inter", "Segoe UI", Arial, sans-serif; }
html, body { height:100%; width:100%; }
body {
    color: var(--text);
    background:
        radial-gradient(circle at 18% 20%, rgba(138,241,255,.16), transparent 38%),
        radial-gradient(circle at 82% 78%, rgba(143,157,255,.20), transparent 42%),
        linear-gradient(140deg, var(--bg-1), var(--bg-2) 65%, #091026);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
}

.container {
    width:min(940px, 100%);
    background: rgba(13, 21, 45, 0.55);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 28px;
    padding: clamp(18px, 3vw, 36px);
    box-shadow: 0 20px 55px rgba(5,10,30,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    backdrop-filter: blur(14px);
}

.clock { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; text-align:center; font-weight:800; }
.digit { min-width: 70px; font-size: clamp(2.5rem, 10vw, 7.5rem); letter-spacing:1px; text-shadow: 0 0 22px rgba(138,241,255,.25); }
.separator { opacity: .82; transform: translateY(-2px); }
.ampm { font-size: clamp(1rem, 2.4vw, 1.7rem); align-self:flex-end; margin-bottom: 16px; color: var(--muted); letter-spacing:1px; }

.animate { animation: fadeUp .32s ease; }
@keyframes fadeUp { 0%{opacity:0; transform: translateY(16px) scale(.95);} 100%{opacity:1; transform: translateY(0) scale(1);} }

.date { margin-top: 12px; text-align:center; font-size: clamp(.95rem, 2.4vw, 1.35rem); color: var(--muted); letter-spacing: .4px; }

.info-panel {
    margin: 20px auto 0;
    padding: 16px 18px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.10);
    background: linear-gradient(145deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
    min-width:min(100%, 560px);
}
.info { text-align:center; }
.location-row { font-size: clamp(.95rem, 2vw, 1.2rem); font-weight:700; }
.weather-row { margin-top: 10px; display:flex; justify-content:center; align-items:center; gap: 10px; font-size: clamp(.95rem, 1.9vw, 1.12rem);} 
.weather-emoji { font-size: clamp(1.2rem, 2.6vw, 1.6rem); }
.weather-detail { margin-top: 6px; font-size: clamp(.8rem, 1.6vw, .98rem); color: var(--muted); }

.toolbar { margin-top: 16px; display:flex; justify-content:center; gap: 10px; flex-wrap:wrap; }
.instruction { text-align:center; margin-top: 12px; color: var(--muted); font-size: .95rem; }

.format-toggle button {
    padding: 10px 16px;
    font-size: .95rem;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.25);
    background: linear-gradient(135deg, rgba(138,241,255,.15), rgba(143,157,255,.2));
    color: #f9fbff;
    font-weight: 700;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
}
.format-toggle button:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(10,20,45,.35); }

@media(max-width:640px){
    .container { border-radius: 20px; }
    .digit { min-width: 44px; }
    .ampm { width:100%; align-self:center; margin-bottom:0; margin-top:-8px; }
}
</style>
</head>
<body>
<div class="container">

<!-- Clock -->
<div class="clock">
    <div class="digit" id="h1">0</div>
    <div class="digit" id="h2">0</div>
    <div class="digit separator">:</div>
    <div class="digit" id="m1">0</div>
    <div class="digit" id="m2">0</div>
    <div class="digit separator">:</div>
    <div class="digit" id="s1">0</div>
    <div class="digit" id="s2">0</div>
    <div class="ampm" id="ampm">AM</div>
</div>

<div class="date" id="date">Loading date...</div>
<div class="info-panel">
    <div class="info location-row" id="location">📍 Loading location...</div>
    <div class="info weather-row" id="weatherRow">
        <span class="weather-emoji" id="weatherEmoji">⛅</span>
        <span id="weather">Loading weather...</span>
    </div>
    <div class="info weather-detail" id="weatherDetail">Fetching local conditions…</div>
</div>

<div class="toolbar">
    <div class="format-toggle" id="formatDiv">
        <button id="toggleFormat">Switch to 24H</button>
    </div>
</div>

<div class="instruction" id="instruction">Press <b>F</b> to toggle fullscreen mode</div>

<script>
// LocalStorage format
let is12Hour = localStorage.getItem('clockFormat') === '24' ? false : true;
document.getElementById('toggleFormat').textContent = is12Hour ? 'Switch to 24H' : 'Switch to 12H';

document.getElementById('toggleFormat').addEventListener('click', () => {
    is12Hour = !is12Hour;
    localStorage.setItem('clockFormat', is12Hour ? '12' : '24');
    document.getElementById('toggleFormat').textContent = is12Hour ? 'Switch to 24H' : 'Switch to 12H';
    updateClock();
});

function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();
    let ampm = '';

    if(is12Hour){
        ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        if(hours===0) hours = 12;
    }

    const hStr = hours.toString().padStart(2,'0');
    const mStr = minutes.toString().padStart(2,'0');
    const sStr = seconds.toString().padStart(2,'0');
    const timeArray = hStr+mStr+sStr;
    const ids=['h1','h2','m1','m2','s1','s2'];

    for(let i=0;i<timeArray.length;i++){
        const el = document.getElementById(ids[i]);
        if(el.textContent!==timeArray[i]){
            el.textContent = timeArray[i];
            el.classList.remove('animate');
            void el.offsetWidth;
            el.classList.add('animate');
        }
    }
    document.getElementById('ampm').textContent = is12Hour ? ampm : '';
}

function updateDate(){
    const now = new Date();

    const englishDate = new Intl.DateTimeFormat('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    }).format(now);

    document.getElementById('date').textContent = englishDate;
}


async function updateLocationAndWeather(){
    const locationEl = document.getElementById('location');
    const weatherEl = document.getElementById('weather');
    const weatherEmojiEl = document.getElementById('weatherEmoji');
    const weatherDetailEl = document.getElementById('weatherDetail');

    const weatherCodeMap = {
        0: ['☀️', 'Clear sky'],
        1: ['🌤️', 'Mainly clear'],
        2: ['⛅', 'Partly cloudy'],
        3: ['☁️', 'Overcast'],
        45: ['🌫️', 'Fog'],
        48: ['🌫️', 'Depositing rime fog'],
        51: ['🌦️', 'Light drizzle'],
        53: ['🌦️', 'Drizzle'],
        55: ['🌧️', 'Dense drizzle'],
        61: ['🌦️', 'Slight rain'],
        63: ['🌧️', 'Rain'],
        65: ['🌧️', 'Heavy rain'],
        71: ['🌨️', 'Slight snow'],
        73: ['❄️', 'Snow'],
        75: ['❄️', 'Heavy snow'],
        80: ['🌦️', 'Rain showers'],
        81: ['🌧️', 'Rain showers'],
        82: ['⛈️', 'Violent rain showers'],
        95: ['⛈️', 'Thunderstorm'],
        96: ['⛈️', 'Thunderstorm with hail'],
        99: ['⛈️', 'Severe thunderstorm with hail']
    };

    try{
        const ipInfoRes = await fetch('https://ipinfo.io/json');
        if(!ipInfoRes.ok) throw new Error('Location API request failed');
        const ipInfo = await ipInfoRes.json();

        const city = ipInfo.city || 'Unknown city';
        const region = ipInfo.region || '';
        const country = ipInfo.country || '';
        const parts = [city, region, country].filter(Boolean);
        const timezone = ipInfo.timezone ? ` • ${ipInfo.timezone}` : '';
        locationEl.textContent = `📍 ${parts.join(', ')}${timezone}`;

        const [latitude, longitude] = (ipInfo.loc || '').split(',');
        if(!latitude || !longitude) throw new Error('Missing coordinates from location API');

        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`;
        const weatherRes = await fetch(weatherUrl);
        if(!weatherRes.ok) throw new Error('Weather API request failed');
        const weatherData = await weatherRes.json();

        const current = weatherData.current_weather;
        if(!current) throw new Error('No current weather data');

        const [emoji, condition] = weatherCodeMap[current.weathercode] || ['🌡️', 'Current conditions'];
        const roundedTemp = Math.round(current.temperature);
        const feelsLike = current.apparent_temperature !== undefined ? Math.round(current.apparent_temperature) : null;
        weatherEmojiEl.textContent = emoji;
        weatherEl.textContent = `${condition} • ${roundedTemp}°C`;
        weatherDetailEl.textContent = feelsLike !== null
            ? `Feels like ${feelsLike}°C • Wind ${Math.round(current.windspeed)} km/h`
            : `Wind ${Math.round(current.windspeed)} km/h`;
    } catch(error){
        locationEl.textContent = '📍 Location unavailable';
        weatherEmojiEl.textContent = '⚠️';
        weatherEl.textContent = 'Weather unavailable';
        weatherDetailEl.textContent = 'Check network access and try again.';
        console.error(error);
    }
}

// Initialize
updateClock();
setInterval(updateClock,1000);
updateDate();
setInterval(updateDate,60000);
updateLocationAndWeather();
setInterval(updateLocationAndWeather,600000);

// Fullscreen toggle F key
document.addEventListener('keydown',(e)=>{
    if(e.key==='f'||e.key==='F'){
        if(!document.fullscreenElement){
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }
});

// Hide/show buttons and instruction in fullscreen
document.addEventListener('fullscreenchange',()=>{
    const formatDiv = document.getElementById('formatDiv');
    const instruction = document.getElementById('instruction');
    if(document.fullscreenElement){
        formatDiv.style.display='none';
        instruction.style.display='none';
    } else {
        formatDiv.style.display='block';
        instruction.style.display='block';
    }
});
</script>

</div>
</body>
</html>
